<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - Silatkar</title>
  
  <!-- Google Fonts & Bootstrap 5 & Bootstrap Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- SweetAlert2 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-dark text-white min-vh-100 d-flex flex-column justify-content-between">

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-damkar">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="index.html">
        <div class="brand-icon-wrap">
          <i class="bi bi-fire"></i>
        </div>
        <div>
          <div class="brand-title">SILATKAR</div>
          <div class="brand-subtitle">Sistem Informasi & Laporan Kebakaran</div>
        </div>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left"></i> Kembali ke Beranda
      </a>
    </div>
  </nav>

  <main class="py-5 my-auto">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          
          <div class="card card-custom border-0 shadow-2xl">
            <div class="card-header-damkar text-center py-4">
              <div class="brand-icon-wrap mx-auto mb-2" style="width: 54px; height: 54px; font-size: 1.8rem;">
                <i class="bi bi-shield-lock-fill"></i>
              </div>
              <h4 class="fw-bold mb-0">PORTAL LOGIN ADMIN</h4>
              <p class="text-white-50 small mb-0">Silatkar - Sistem Laporan Kebakaran Damkar</p>
            </div>

            <div class="card-body p-4 p-md-4 text-dark">
              
              <!-- Login Alert -->
              <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small mb-3">
                <i class="bi bi-exclamation-triangle-fill me-1"></i> <span id="login-alert-text"></span>
              </div>

              <form id="form-login" novalidate>
                
                <!-- Username -->
                <div class="mb-3">
                  <label for="username" class="form-label fw-bold">Username Admin</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-person-fill text-secondary"></i></span>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Masukkan username" required autofocus>
                  </div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                  <label for="password" class="form-label fw-bold">Password</label>
                  <div class="input-group">
                    <span class="input-group-text bg-light"><i class="bi bi-key-fill text-secondary"></i></span>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Masukkan password" required>
                  </div>
                </div>

                <!-- Button -->
                <div class="d-grid gap-2">
                  <button type="submit" id="btn-login" class="btn btn-danger btn-lg py-2.5 fw-bold rounded-3 shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> MASUK SYSTEM ADMIN
                  </button>
                </div>

              </form>

              <!-- Credentials Default Info -->
              <div class="mt-4 p-3 bg-light rounded border text-center small">
                <p class="fw-bold mb-1 text-dark"><i class="bi bi-info-circle-fill text-primary me-1"></i> Default Credentials Admin:</p>
                <div class="text-muted">Username: <strong>admin</strong> | Password: <strong>admin123</strong></div>
              </div>

            </div>
          </div>

        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 text-center small text-white-50 border-top border-secondary">
    &copy; 2026 Silatkar - Sistem Laporan Kebakaran Damkar. All Rights Reserved.
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
